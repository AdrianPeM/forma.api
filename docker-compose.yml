services:
  forma.api:
    build:
        context: .
        dockerfile: Dockerfile
    image: adrianpem08/forma.api
    container_name: forma.api_container
    ports:
      - "8000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgresdb;Username=postgres;Password=admin;Database=forma_api_db_dev;TrustServerCertificate=true;
      - JwtConfig__Issuer=https://localhost:7059
      - JwtConfig__Audience=https://localhost:7059
      - JwtConfig__Key=92704a2aaa650fe6687c230a2f47eaf03f807ce7479f334dfaa72c92cfe146cf98c686824219247582c11b3f5bdd69ae7924625c47a7493989745b4c2ecffc34
    # networks:
    #     - shared_network_forma.api
    depends_on:
      postgresdb:
        condition: service_started

  postgresdb:
    image: postgres:17.5
    container_name: postgresdb_container
    restart: always
    volumes:
      - forma.api_volume:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: forma_api_db_dev
    ports:
      - "5432:5432"
# networks:
#     shared_network_forma.api:
#         external: true
networks:
  default:
    name: forma.api_network

volumes:
  forma.api_volume:
    external: true
